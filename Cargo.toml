[package]
name = "medieval-idle"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7" }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
